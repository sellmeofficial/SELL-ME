<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product | SELL ME</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">SELL ME</a>
    </div>
</nav>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="mb-4">Add New Product</h2>

<form>

<div class="mb-3">
<label class="form-label">Product Name</label>
<input type="text" class="form-control" placeholder="Samsung Galaxy A55">
</div>

<div class="mb-3">
<label class="form-label">Category</label>

<select class="form-select">

<option>Phones</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Groceries</option>
<option>Furniture</option>
<option>Services</option>

</select>

</div>

<div class="mb-3">
<label class="form-label">Price (E)</label>
<input type="number" class="form-control" placeholder="5800">
</div>

<div class="mb-3">
<label class="form-label">Description</label>
<textarea class="form-control" rows="5"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Product Image</label>
<input type="file" class="form-control">
</div>

<button class="btn btn-success btn-lg">
Publish Product
</button>

</form>

</div>

</div>

</body>
</html>
